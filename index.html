<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>退休動態提領模擬器 v4.0 - 旗艦版</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom": "https://esm.sh/react-dom@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "recharts": "https://esm.sh/recharts@2.12.0?external=react,react-dom",
            "lucide-react": "https://esm.sh/lucide-react@0.300.0?external=react"
        }
    }
    </script>

    <style>
        body { font-family: "Inter", "Noto Sans TC", sans-serif; background-color: #f8fafc; }
        input[type="range"] { accent-color: #4f46e5; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .sticky-col { position: sticky; left: 0; background-color: #ffffff; z-index: 20; box-shadow: 2px 0 5px -2px rgba(0,0,0,0.1); }
        .sticky-header { position: sticky; top: 0; z-index: 30; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, memo } from 'react';
        import { createRoot } from 'react-dom/client';
        import { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip as RechartsTooltip, ResponsiveContainer, ReferenceLine, Legend, ComposedChart, Bar, BarChart } from 'recharts';
        import { Settings, Activity, ShieldCheck, Scale, BookOpen, TrendingUp, RefreshCw, Maximize2, FileSearch, LineChart as ChartIcon, ExternalLink, HelpCircle, PieChart } from 'lucide-react';

        // --- Math & Simulation Engine ---
        const randn_bm = () => {
            let u = 0, v = 0;
            while (u === 0) u = Math.random();
            while (v === 0) v = Math.random();
            return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
        };

        const strategiesDef = [
            { 
                id: 'baseline', name: '傳統 4% 法則', color: '#94a3b8', icon: <BookOpen size={16}/>, 
                desc: '無論市場漲跌，每年提取首年金額並跟隨通膨調升。生活費最穩，但在大跌時極易耗盡本金。',
                calcSteps: [
                    '首年提領 = 初始資產 × 初始提領率',
                    '次年提領 = 前一年提領額 × (1 + 當年通膨率)',
                    '無視當下資產餘額，強行提領直至歸零'
                ]
            },
            { 
                id: 'vanguard', name: 'Vanguard 動態護欄', color: '#0ea5e9', icon: <ShieldCheck size={16}/>, 
                desc: '提領當下資產的固定比例，但設有變動「天花板」與「地板」，上下限基準為【前一年的實際提領額】。',
                calcSteps: [
                    '預期提領 = 當下資產餘額 × 初始提領率',
                    '設定上限 = 前一年實領金額 × (1 + 上限參數%)',
                    '設定下限 = 前一年實領金額 × (1 - 下限參數%)',
                    '最終提領 = 將預期提領限制於【下限, 上限】區間'
                ]
            },
            { 
                id: 'guyton', name: 'Guyton-Klinger', color: '#f59e0b', icon: <TrendingUp size={16}/>, 
                desc: '負報酬凍結通膨；提領率飆高時強制限縮生活費(保本)，提領率過低時主動加薪(繁榮)。',
                calcSteps: [
                    '若當年市場負報酬，凍結通膨調整(次年提領=去年)',
                    '當下真實提領率 = 預期提領額 ÷ 當下資產餘額',
                    '[保本]: 負報酬 且 提領率 > 初始提領率×(1+保本閥值)，提領額削減 X%',
                    '[繁榮]: 正報酬 且 提領率 < 初始提領率×(1-繁榮閥值)，提領額增加 Y%'
                ]
            }
        ];

        // --- 股債配置連動模型 ---
        const getAssetAllocationParams = (stockRatio) => {
            const stockReturn = 10.0; const stockVol = 18.0;
            const bondReturn = 4.0;  const bondVol = 5.0;
            const correlation = 0.1; 

            const wS = stockRatio / 100;
            const wB = 1 - wS;

            const expectedReturn = wS * stockReturn + wB * bondReturn;
            const expectedVol = Math.sqrt(
                Math.pow(wS * stockVol, 2) + 
                Math.pow(wB * bondVol, 2) + 
                2 * wS * wB * stockVol * bondVol * correlation
            );

            return {
                r: parseFloat(expectedReturn.toFixed(1)),
                v: parseFloat(expectedVol.toFixed(1))
            };
        };

        // --- UI Components ---
        const InputSlider = memo(({ label, value, setter, min, max, step, suffix, info, color = 'indigo' }) => {
            const [inputValue, setInputValue] = useState(value);
            useEffect(() => setInputValue(value), [value]);
            
            const handleBlur = () => {
                let num = parseFloat(inputValue);
                if (isNaN(num)) num = value;
                if (num < min) num = min;
                if (num > max) num = max;
                setter(num);
                setInputValue(num);
            };

            const bgColors = {
                indigo: 'bg-slate-50/50 border-slate-200',
                sky: 'bg-sky-50/30 border-sky-100/50',
                amber: 'bg-amber-50/30 border-amber-100/50',
                emerald: 'bg-emerald-50/30 border-emerald-100/50',
            };

            return (
                <div className={`p-3 md:p-3 rounded-lg border ${bgColors[color]} flex flex-col h-full relative group`}>
                    <div className="flex justify-between items-center gap-1 mb-3">
                        <label className="text-xs font-bold text-slate-700 flex items-center gap-1 whitespace-nowrap tracking-tight">
                            {label}
                            {info && (
                                <div className="relative flex items-center">
                                    <HelpCircle size={13} className="text-slate-400 cursor-help" />
                                    <div className="absolute bottom-full mb-2 left-1/2 -translate-x-1/2 w-48 p-2 bg-slate-800 text-white text-[10px] rounded shadow-lg opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all z-50 pointer-events-none whitespace-normal">
                                        {info}
                                        <div className="absolute top-full left-1/2 -translate-x-1/2 border-4 border-transparent border-t-slate-800"></div>
                                    </div>
                                </div>
                            )}
                        </label>
                        <div className="flex items-center bg-white rounded border border-slate-300 shadow-sm px-1.5 py-0.5 shrink-0 min-w-0">
                            <input 
                                type="number" step={step} value={inputValue} 
                                onChange={(e) => setInputValue(e.target.value)} 
                                onBlur={handleBlur}
                                onKeyDown={(e) => e.key === 'Enter' && e.target.blur()}
                                className="w-10 sm:w-12 text-xs font-mono text-right bg-transparent outline-none p-0 appearance-none font-bold text-slate-700"
                            />
                            <span className="text-[10px] text-slate-500 pl-1 shrink-0">{suffix}</span>
                        </div>
                    </div>
                    <div className="mt-auto pt-1">
                        <input
                            type="range" min={min} max={max} step={step} value={value}
                            onChange={(e) => setter(Number(e.target.value))}
                            className={`w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-${color}-500`}
                        />
                    </div>
                </div>
            );
        });

        const CustomTooltip = ({ active, payload, label }) => {
            if (active && payload && payload.length) {
                const filteredPayload = payload.filter(entry => !String(entry.dataKey).includes('_bg_'));

                return (
                    <div className="bg-white/95 backdrop-blur p-3 border border-slate-200 shadow-xl rounded-xl text-xs z-50 min-w-[160px]">
                        <p className="font-bold text-slate-700 mb-2 border-b border-slate-100 pb-1">
                            <span>退休第 {label} 年</span>
                        </p>
                        <div className="space-y-2">
                            {filteredPayload.map((entry, index) => {
                                let val = entry.value;
                                if (typeof val !== 'number') return null; 
                                
                                const isPercent = entry.name === '市場報酬' || String(entry.dataKey).includes('survival') || String(entry.name).includes('率') || String(entry.name).includes('佔比');
                                
                                if (isPercent) val = val.toFixed(1) + '%';
                                else val = Math.round(val).toLocaleString() + ' 萬';
                                
                                return (
                                    <div key={index} className="flex items-center justify-between gap-4">
                                        <div className="flex items-center gap-1.5">
                                            <span className="w-2 h-2 rounded-sm" style={{ backgroundColor: entry.color || entry.fill }}></span>
                                            <span className="font-medium text-slate-600 truncate max-w-[80px]">{entry.name}</span>
                                        </div>
                                        <span className="font-mono font-bold" style={{ color: entry.color || entry.fill }}>{val}</span>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                );
            }
            return null;
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('monteCarlo'); 
            const [auditStrategy, setAuditStrategy] = useState('guyton');
            const [simSeed, setSimSeed] = useState(0); 
            const [showDefinitions, setShowDefinitions] = useState(false);
            
            const [initialCapital, setInitialCapital] = useState(2000); 
            const [initialWithdrawalRate, setInitialWithdrawalRate] = useState(4.0); 
            
            // 預設為 80% 股債比
            const [stockRatio, setStockRatio] = useState(80);
            
            const [cagr, setCagr] = useState(8.8); 
            const [volatility, setVolatility] = useState(14.5); 
            const [inflation, setInflation] = useState(3.0); 
            const [years, setYears] = useState(30);
            const [simCount, setSimCount] = useState(1000);
            const [sorrTest, setSorrTest] = useState(false);

            const handleStockRatioChange = (newRatio) => {
                setStockRatio(newRatio);
                const params = getAssetAllocationParams(newRatio);
                setCagr(params.r);
                setVolatility(params.v);
            };

            const [vanCeiling, setVanCeiling] = useState(5.0); 
            const [vanFloor, setVanFloor] = useState(2.5); 
            const [gkCapPreserveThresh, setGkCapPreserveThresh] = useState(20); 
            const [gkCapPreserveCut, setGkCapPreserveCut] = useState(10); 
            const [gkProsperityThresh, setGkProsperityThresh] = useState(20); 
            const [gkProsperityHike, setGkProsperityHike] = useState(10); 

            const [viewMode, setViewMode] = useState('netWorth'); 
            const [auditChartMode, setAuditChartMode] = useState('netWorth'); 
            const [simResults, setSimResults] = useState(null);
            const [isSimulating, setIsSimulating] = useState(false);

            useEffect(() => {
                setIsSimulating(true);
                const timer = setTimeout(() => {
                    const runSimulationWithReturns = () => {
                        const initialWithdrawal = initialCapital * (initialWithdrawalRate / 100);
                        
                        const pathsNW = { baseline: [], vanguard: [], guyton: [] };
                        const pathsW = { baseline: [], vanguard: [], guyton: [] };
                        const survivals = { baseline: new Array(years + 1).fill(0), vanguard: new Array(years + 1).fill(0), guyton: new Array(years + 1).fill(0) };
                        
                        // 修正重點：新增 survivorWithdrawn 陣列，專門記錄成功存活路徑的總提領額
                        let totals = {
                            baseline: { dead: 0, finalNW: [], totalWithdrawn: [], survivorWithdrawn: [], downgradedYears: 0, wCVData: [] },
                            vanguard: { dead: 0, finalNW: [], totalWithdrawn: [], survivorWithdrawn: [], downgradedYears: 0, wCVData: [] },
                            guyton: { dead: 0, finalNW: [], totalWithdrawn: [], survivorWithdrawn: [], downgradedYears: 0, wCVData: [] }
                        };

                        const auditData = [];
                        const universePerformances = []; 

                        for (let i = 0; i < simCount; i++) {
                            const marketReturns = [];
                            const inflFactors = []; 
                            let currentInflFactor = 1;
                            let pathMarketReturn = 1; 
                            
                            for (let t = 0; t < years; t++) {
                                const Z = randn_bm();
                                let r = (cagr / 100) + (volatility / 100) * Z;
                                
                                if (sorrTest && t < 3) { r = -0.15; }

                                marketReturns.push(r);
                                pathMarketReturn *= (1 + r);
                                
                                currentInflFactor *= (1 + (inflation / 100));
                                inflFactors.push(currentInflFactor);
                                
                                if (i === 0) {
                                    auditData.push({
                                        year: t + 1, marketReturn: r * 100, inflationMult: currentInflFactor,
                                        baseline: {}, vanguard: {}, guyton: {}
                                    });
                                }
                            }
                            
                            universePerformances.push({ idx: i, totalReturn: pathMarketReturn, returns: marketReturns });

                            const simulateStrategy = (stratId, logicFn) => {
                                let nw = initialCapital;
                                let w = 0;
                                let dead = false;
                                const pathNW = [];
                                const pathW = [];
                                const pathRealW = [];
                                let totW = 0;

                                for (let t = 0; t < years; t++) {
                                    let currentNote = '';
                                    const expectedRealW = t === 0 ? initialWithdrawal : initialWithdrawal * inflFactors[t-1];

                                    if (!dead) {
                                        const res = logicFn(t, nw, pathW, marketReturns, inflFactors, expectedRealW);
                                        w = res.w;
                                        currentNote = res.note;
                                    } else {
                                        w = 0;
                                        currentNote = '資產耗盡';
                                    }

                                    if (w < expectedRealW - 0.1) totals[stratId].downgradedYears++;

                                    if (!dead) {
                                        nw -= w;
                                        if (nw <= 0) { nw = 0; dead = true; }
                                        else { nw *= (1 + marketReturns[t]); }
                                    }
                                    
                                    totW += w;
                                    pathNW.push(nw);
                                    pathW.push(w);
                                    pathRealW.push(t === 0 ? w : w / inflFactors[t-1]);
                                    
                                    if (!dead) survivals[stratId][t+1]++;
                                    
                                    if (i === 0) {
                                        auditData[t][stratId].nw = nw;
                                        auditData[t][stratId].w = w;
                                        auditData[t][stratId].note = currentNote;
                                    }
                                }
                                
                                if (nw <= 0) totals[stratId].dead++;
                                totals[stratId].finalNW.push(nw);
                                totals[stratId].totalWithdrawn.push(totW);
                                
                                // 修正重點：若資產未耗盡，則將總提領記錄至「倖存者清單」
                                if (nw > 0) {
                                    totals[stratId].survivorWithdrawn.push(totW);
                                }

                                const meanW = pathRealW.reduce((a,b)=>a+b,0) / years;
                                const varW = pathRealW.reduce((a,b)=>a+Math.pow(b-meanW, 2),0) / years;
                                const stdW = Math.sqrt(varW);
                                totals[stratId].wCVData.push(meanW > 0 ? (stdW / meanW) * 100 : 0);
                            };

                            simulateStrategy('baseline', (t, nw, histW, mr, inf, exp) => {
                                if (t === 0) return { w: initialWithdrawal, note: '初始提領' };
                                return { w: initialWithdrawal * inf[t-1], note: '依通膨調整' };
                            });

                            simulateStrategy('vanguard', (t, nw, histW, mr, inf, exp) => {
                                if (t === 0) return { w: initialWithdrawal, note: '初始提領' };
                                const expectedW = nw * (initialWithdrawalRate / 100); 
                                const prevActualW = histW[t-1]; 
                                const maxW = prevActualW * (1 + vanCeiling / 100); 
                                const minW = prevActualW * (1 - vanFloor / 100);   
                                const actualW = Math.min(Math.max(expectedW, minW), maxW);
                                
                                let note = '比例自然變動';
                                if (actualW === maxW && expectedW > maxW + 0.1) note = '🟢觸發上限 (限縮)';
                                else if (actualW === minW && expectedW < minW - 0.1) note = '🔴觸發下限 (保護)';
                                return { w: actualW, note };
                            });

                            simulateStrategy('guyton', (t, nw, histW, mr, inf, exp) => {
                                if (t === 0) return { w: initialWithdrawal, note: '初始提領' };
                                const prevReturn = mr[t-1];
                                let nextW = histW[t-1];
                                let note = '';
                                
                                if (prevReturn >= 0) { nextW *= (1 + inflation / 100); note = '隨通膨增加'; } 
                                else { note = '❄️凍結通膨'; } 

                                const wr = (nextW / nw) * 100;
                                if (prevReturn < 0 && wr > initialWithdrawalRate * (1 + gkCapPreserveThresh/100)) {
                                    nextW *= (1 - gkCapPreserveCut/100); note += ' | 🔴保本刪減';
                                } else if (prevReturn > 0 && wr < initialWithdrawalRate * (1 - gkProsperityThresh/100)) {
                                    nextW *= (1 + gkProsperityHike/100); note = '🟢繁榮加薪';
                                }
                                return { w: nextW, note };
                            });
                        }

                        const chartDataNW = [];
                        const chartDataW = [];
                        const chartDataSurv = [];

                        universePerformances.sort((a, b) => a.totalReturn - b.totalReturn);
                        const medianUniverse = universePerformances[Math.floor(simCount / 2)];
                        const medianUniverseIdx = medianUniverse.idx;
                        const medianReturns = medianUniverse.returns; 

                        for (let t = 0; t <= years; t++) {
                            survivals.baseline[0] = simCount; survivals.vanguard[0] = simCount; survivals.guyton[0] = simCount;
                            
                            chartDataSurv.push({
                                year: t,
                                baseline: (survivals.baseline[t] / simCount) * 100,
                                vanguard: (survivals.vanguard[t] / simCount) * 100,
                                guyton: (survivals.guyton[t] / simCount) * 100
                            });

                            const nwAtT = { year: t };
                            const wAtT = { year: t };
                            
                            const mRet = t > 0 ? medianReturns[t-1] * 100 : null;
                            nwAtT.marketReturn = mRet;
                            if (t < years) wAtT.marketReturn = mRet;

                            ['baseline', 'vanguard', 'guyton'].forEach(strat => {
                                nwAtT[strat] = pathsNW[strat][medianUniverseIdx][t];
                                if (t < years) wAtT[strat] = pathsW[strat][medianUniverseIdx][t];
                            });
                            
                            chartDataNW.push(nwAtT);
                            if (t < years) chartDataW.push(wAtT);
                        }

                        const stats = {};
                        ['baseline', 'vanguard', 'guyton'].forEach(strat => {
                            const finalNWs = totals[strat].finalNW.sort((a,b)=>a-b);
                            // 修正重點：改為計算 survivorWithdrawn 的平均值
                            const survivorWs = totals[strat].survivorWithdrawn;
                            const avgWithdrawn = survivorWs.length > 0 ? (survivorWs.reduce((a,b)=>a+b,0) / survivorWs.length) : 0;
                            
                            const cvs = totals[strat].wCVData.sort((a,b)=>a-b);
                            stats[strat] = {
                                successRate: ((simCount - totals[strat].dead) / simCount) * 100,
                                avgWithdrawn: avgWithdrawn,
                                qolRate: 100 - ((totals[strat].downgradedYears / (simCount * years)) * 100),
                                medianCV: cvs[Math.floor(simCount / 2)] 
                            };
                        });

                        return { chartDataNW, chartDataW, chartDataSurv, stats, auditData };
                    };

                    const res = runSimulationWithReturns();
                    setSimResults(res);
                    setIsSimulating(false);
                }, 50);
                return () => clearTimeout(timer);
            }, [initialCapital, initialWithdrawalRate, cagr, volatility, inflation, years, simCount, vanCeiling, vanFloor, gkCapPreserveThresh, gkCapPreserveCut, gkProsperityThresh, gkProsperityHike, simSeed, sorrTest]);

            const renderChart = () => {
                if (!simResults) return null;
                
                let data = [];
                let yAxisLabel = '';
                
                if (viewMode === 'netWorth') { data = simResults.chartDataNW; yAxisLabel = '淨值 (萬)'; }
                else if (viewMode === 'withdrawal') { data = simResults.chartDataW; yAxisLabel = '每年提領額 (萬)'; }
                else if (viewMode === 'survival') { data = simResults.chartDataSurv; yAxisLabel = '資金存活機率 (%)'; }

                const legendPayload = strategiesDef.map(s => ({
                    id: s.id, type: 'circle', value: s.name.split(' ')[0], color: s.color
                }));

                return (
                    <div className="h-[300px] md:h-[400px] w-full mt-2 md:mt-4">
                        <ResponsiveContainer width="100%" height="100%">
                            <ComposedChart data={data} margin={{ top: 10, right: 10, left: 0, bottom: 20 }}>
                                <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                                <XAxis 
                                    dataKey="year" 
                                    type="number"
                                    domain={[0, 'dataMax']}
                                    tickCount={Math.floor(years / 5) + 1}
                                    label={{ value: '退休進入第 N 年', position: 'insideBottom', offset: -15, fontSize: 10, fill: '#94a3b8' }} 
                                    stroke="#cbd5e1" 
                                    tick={{fontSize: 10, fill: '#94a3b8'}} 
                                    tickMargin={8} 
                                />
                                <YAxis 
                                    yAxisId="left"
                                    stroke="#cbd5e1" 
                                    tickFormatter={(val) => typeof val === 'number' ? (val >= 10000 ? (val/10000).toFixed(0)+'億' : val.toLocaleString()) : val} 
                                    width={45}
                                    domain={viewMode === 'survival' ? [0, 100] : ['auto', 'auto']}
                                    tick={{fontSize: 10, fill: '#94a3b8'}}
                                />
                                {viewMode !== 'survival' && (
                                    <YAxis 
                                        yAxisId="right" 
                                        orientation="right" 
                                        type="number" 
                                        tickFormatter={(val) => typeof val === 'number' ? val.toFixed(0)+'%' : val} 
                                        tick={{fontSize: 10, fill: '#cbd5e1'}} 
                                        domain={['auto', 'auto']} 
                                        width={35} 
                                    />
                                )}
                                <RechartsTooltip content={<CustomTooltip />} />
                                <Legend payload={legendPayload} verticalAlign="top" height={36} wrapperStyle={{ fontSize: '11px', fontWeight: 'bold', color: '#475569' }}/>
                                
                                {viewMode !== 'survival' && (
                                    <Bar yAxisId="right" dataKey="marketReturn" name="市場報酬" fill="#e2e8f0" radius={[2, 2, 0, 0]} opacity={0.6} />
                                )}

                                {strategiesDef.map(s => (
                                    <Line yAxisId="left" key={`main_${s.id}`} type="monotone" dataKey={s.id} name={s.name.split(' ')[0]} stroke={s.color} strokeWidth={2.5} dot={false} activeDot={{ r: 5, strokeWidth: 0 }} legendType="none" />
                                ))}
                                
                                {viewMode === 'survival' && <ReferenceLine yAxisId="left" y={100} stroke="#e2e8f0" strokeDasharray="3 3" />}

                                    </div>

                                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                                        <div className="bg-slate-50 px-4 md:px-5 py-3 md:py-4 border-b border-slate-200 flex justify-between items-center">
                                            <h3 className="font-extrabold text-slate-800 text-sm md:text-base">壓力測試結算報告</h3>
                                            <span className="text-[10px] md:text-xs font-bold text-slate-500 bg-white border border-slate-200 px-2 py-1 rounded">第 {years} 年 | 模擬 {simCount} 次</span>
                                        </div>
                                        
                                        <div className="p-4 md:p-5 border-b border-slate-100 bg-white">
                                            <h4 className="text-sm font-bold text-slate-700 mb-1">生存率 vs 生活品質對比</h4>
                                            <p className="text-[11px] text-slate-500 mb-4">動態提領的本質，就是用「犧牲部分年份的購買力(生活降級)」來換取「極高的資金存活率」的等價交換。</p>
                                            <div className="h-[200px] md:h-[250px] w-full mt-4">
                                                <ResponsiveContainer width="100%" height="100%">
                                                    <BarChart data={barChartData} margin={{ top: 10, right: 0, left: -20, bottom: 0 }} barGap={2} barCategoryGap="15%">
                                                        <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                                                        <XAxis dataKey="name" tick={{fontSize: 10, fill: '#64748b', fontWeight: 'bold'}} axisLine={false} tickLine={false} />
                                                        <YAxis tickFormatter={(val) => `${val}%`} tick={{fontSize: 9, fill: '#94a3b8'}} axisLine={false} tickLine={false} />
                                                        <RechartsTooltip cursor={{fill: '#f8fafc'}} content={({active, payload}) => {
                                                            if (active && payload && payload.length) {
                                                                return (
                                                                    <div className="bg-white/95 backdrop-blur p-2.5 border border-slate-200 shadow-xl rounded-xl text-xs z-50">
                                                                        <p className="font-bold text-slate-700 mb-1.5 border-b border-slate-100 pb-1">{payload[0].payload.name}</p>
                                                                        <div className="space-y-1.5">
                                                                            {payload.map((entry, index) => (
                                                                                <div key={index} className="flex justify-between gap-4 items-center">
                                                                                    <div className="flex items-center gap-1.5">
                                                                                        <span className="w-2 h-2 rounded-sm" style={{backgroundColor: entry.color}}></span>
                                                                                        <span className="font-medium text-slate-600">{strategiesDef.find(s => s.id === entry.dataKey)?.name.split(' ')[0]}</span>
                                                                                    </div>
                                                                                    <span className="font-mono font-bold text-slate-700">{entry.value.toFixed(1)}%</span>
                                                                                </div>
                                                                            ))}
                                                                        </div>
                                                                    </div>
                                                                )
                                                            } return null;
                                                        }} />
                                                        <Legend verticalAlign="top" wrapperStyle={{ fontSize: '10px', fontWeight: 'bold', paddingBottom: '10px' }} content={() => (
                                                            <div className="flex flex-wrap justify-center gap-x-3 gap-y-1.5">
                                                                {strategiesDef.map(s => (
                                                                    <div key={s.id} className="flex items-center gap-1">
                                                                        <span className="w-2.5 h-2.5 rounded-full" style={{backgroundColor: s.color}}></span>
                                                                        <span className="text-[10px] text-slate-600">{s.name.split(' ')[0]}</span>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        )} />
                                                        {strategiesDef.map(s => <Bar key={s.id} dataKey={s.id} fill={s.color} radius={[4, 4, 0, 0]} maxBarSize={40} animationDuration={800} />)}
                                                    </BarChart>
                                                </ResponsiveContainer>
                                            </div>
                                        </div>

                                        <div className="overflow-x-auto custom-scroll bg-white">
                                            <div className="min-w-[800px]">
                                                <table className="w-full text-xs md:text-sm text-center table-fixed">
                                                    <thead className="font-extrabold text-slate-500 bg-slate-50 border-b border-slate-200">
                                                        <tr>
                                                            <th className="w-1/5 px-2 py-3 border-r border-slate-100">策略</th>
                                                            <th className="w-1/5 px-2 py-3 border-r border-slate-100 text-emerald-700 bg-emerald-50/50">存活率</th>
                                                            <th className="w-1/5 px-2 py-3 border-r border-slate-100 text-blue-700 bg-blue-50/50">
                                                                <div>預期生活品質佔比</div>
                                                                <div className="text-[9px] font-normal text-blue-600/70 mt-0.5 tracking-tighter leading-tight">(維持或超越首年購買力)</div>
                                                            </th>
                                                            <th className="w-1/5 px-2 py-3 border-r border-slate-100 text-amber-700 bg-amber-50/50">
                                                                <div>提領變異係數(CV)</div>
                                                                <div className="text-[9px] font-normal text-amber-600/70 mt-0.5 tracking-tighter leading-tight">(越低越穩，生活費不亂跳)</div>
                                                            </th>
                                                            <th className="w-1/5 px-2 py-3 text-slate-600 bg-slate-100/50">
                                                                {/* 修正重點5：加入附註說明，精確解釋平均總提領的計算基準 */}
                                                                <div>生涯總提領均值</div>
                                                                <div className="text-[9px] font-normal text-slate-500 mt-0.5 tracking-tighter leading-tight">(排除破產，僅計存活路徑)</div>
                                                            </th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-slate-100">
                                                        {strategiesDef.map(s => {
                                                            const stat = simResults?.stats?.[s.id];
                                                            if (!stat) return null;
                                                            return (
                                                                <tr key={s.id} className="hover:bg-slate-50/80 transition-colors">
                                                                    <td className="px-2 py-3 md:py-4 font-bold border-r border-slate-100">
                                                                        <div className="flex items-center justify-center gap-1.5 truncate" style={{ color: s.color }}>
                                                                            {s.icon} <span>{s.name.split(' ')[0]}</span>
                                                                        </div>
                                                                    </td>
                                                                    <td className="px-2 py-3 md:py-4 font-mono font-bold text-emerald-700 bg-emerald-50/20 border-r border-slate-100">{stat.successRate.toFixed(1)}%</td>
                                                                    <td className="px-2 py-3 md:py-4 font-mono font-bold text-blue-700 bg-blue-50/20 border-r border-slate-100">{stat.qolRate.toFixed(1)}%</td>
                                                                    <td className="px-2 py-3 md:py-4 font-mono font-bold text-amber-700 bg-amber-50/20 border-r border-slate-100">{stat.medianCV.toFixed(1)}%</td>
                                                                    <td className="px-2 py-3 md:py-4 font-mono text-slate-700 bg-slate-50/30">{Math.round(stat.avgWithdrawn).toLocaleString()} 萬</td>
                                                                </tr>
                                                            );
                                                        })}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            ) : renderAuditTrail()}
                            
                            <div className="mt-8 mb-6 text-center">
                                <a href="https://www.facebook.com/search/top?q=指數三寶飯" target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-1.5 text-[10px] text-slate-300 hover:text-slate-500 transition-colors group">
                                    <span>Designed by</span><span className="font-bold underline decoration-slate-200 underline-offset-2 group-hover:decoration-slate-400">fb/指數三寶飯</span><ExternalLink size={10} className="opacity-60 group-hover:opacity-100" />
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
