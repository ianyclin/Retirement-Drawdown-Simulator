<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>退休動態提領模擬器 v5.0</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom": "https://esm.sh/react-dom@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "recharts": "https://esm.sh/recharts@2.12.0?external=react,react-dom",
            "lucide-react": "https://esm.sh/lucide-react@0.300.0?external=react"
        }
    }
    </script>

    <style>
        body { font-family: "Inter", "Noto Sans TC", sans-serif; background-color: #f8fafc; }
        input[type="range"] { accent-color: #4f46e5; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .sticky-col { position: sticky; left: 0; background-color: #ffffff; z-index: 20; box-shadow: 2px 0 5px -2px rgba(0,0,0,0.1); }
        .sticky-header { position: sticky; top: 0; z-index: 30; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, memo } from 'react';
        import { createRoot } from 'react-dom/client';
        import { LineChart, Line, Area, XAxis, YAxis, CartesianGrid, Tooltip as RechartsTooltip, ResponsiveContainer, ReferenceLine, Legend, ComposedChart, Bar, BarChart } from 'recharts';
        import { Settings, Activity, ShieldCheck, Scale, BookOpen, TrendingUp, RefreshCw, Maximize2, FileSearch, LineChart as ChartIcon, ExternalLink, HelpCircle, PieChart } from 'lucide-react';

        // --- Math & Simulation Engine ---
        const randn_bm = () => {
            let u = 0, v = 0;
            while (u === 0) u = Math.random();
            while (v === 0) v = Math.random();
            return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
        };

        const strategiesDef = [
            { 
                id: 'baseline', name: '傳統 4% 法則', color: '#94a3b8', icon: <BookOpen size={16}/>, 
                desc: '無論市場漲跌，每年提取首年金額並跟隨通膨調升。生活費最穩，但在大跌時極易耗盡本金。',
                calcSteps: [
                    '首年提領 = 初始資產 × 初始提領率',
                    '次年提領 = 前一年提領額 × (1 + 當年通膨率)',
                    '無視當下資產餘額，強行提領直至歸零'
                ]
            },
            { 
                id: 'vanguard', name: 'Vanguard 動態護欄', color: '#0ea5e9', icon: <ShieldCheck size={16}/>, 
                desc: '提領當下資產的固定比例，但設有變動「天花板」與「地板」，上下限基準為【前一年的實際提領額】。',
                calcSteps: [
                    '預期提領 = 當下資產餘額 × 初始提領率',
                    '設定上限 = 前一年實領金額 × (1 + 上限參數%)',
                    '設定下限 = 前一年實領金額 × (1 - 下限參數%)',
                    '最終提領 = 將預期提領限制於【下限, 上限】區間'
                ]
            },
            { 
                id: 'guyton', name: 'Guyton-Klinger', color: '#f59e0b', icon: <TrendingUp size={16}/>, 
                desc: '修正版提領法則：前一年負報酬「且」調升後提領率仍高於初始率時才凍結通膨；提領率衝破上護欄則保本減薪(末15年停用)，跌破下護欄則繁榮加薪。護欄只看提領率相對初始率的位置，與報酬正負脫鉤。',
                calcSteps: [
                    '候選提領 = 去年提領 × (1 + 通膨率)',
                    '修正WR：僅當「去年負報酬」且「調升後提領率 > 初始提領率」才凍結(維持去年金額，不補)',
                    '當前提領率 = 候選提領 ÷ 當下資產餘額',
                    '[保本CPR] 提領率 > 初始率×(1+保本閥值) 且 剩餘年數 > 15：提領削減 X%',
                    '[繁榮PR] 提領率 < 初始率×(1−繁榮閥值)：提領增加 Y%(不受末15年限制)'
                ]
            },
            {
                id: 'endowment', name: 'Yale 平滑法', color: '#ec4899', icon: <Scale size={16}/>,
                desc: '耶魯校務基金的 Tobin(1974)平滑規則：當年提領 = 權重 ×(去年提領×通膨)＋(1−權重)×(當下資產×目標提領率)，耶魯預設權重 80%。介於「固定金額(對市場無感)」與「純百分比(大起大落)」之間，緩慢適應市場但不劇烈跳動。權重可在左側調整：100%≈退化成固定金額(4%法則)、0%≈退化成純百分比提領。',
                calcSteps: [
                    '錨點 = 去年提領 × (1 + 通膨率)　(維持去年生活水準)',
                    '目標 = 當下資產 × 初始提領率',
                    '當年提領 = 權重 × 錨點 + (1−權重) × 目標',
                    '預設 80/20(Tobin/耶魯)；權重可調，兩端會退化成固定金額或純百分比'
                ]
            }
        ];

        // --- 股債配置連動模型 ---
        const getAssetAllocationParams = (stockRatio) => {
            const stockReturn = 10.0; const stockVol = 18.0;
            const bondReturn = 4.0;  const bondVol = 5.0;
            const correlation = 0.1; 

            const wS = stockRatio / 100;
            const wB = 1 - wS;

            const expectedReturn = wS * stockReturn + wB * bondReturn;
            const expectedVol = Math.sqrt(
                Math.pow(wS * stockVol, 2) + 
                Math.pow(wB * bondVol, 2) + 
                2 * wS * wB * stockVol * bondVol * correlation
            );

            return {
                r: parseFloat(expectedReturn.toFixed(1)),
                v: parseFloat(expectedVol.toFixed(1))
            };
        };

        // --- UI Components ---
        const InputSlider = memo(({ label, value, setter, min, max, step, suffix, info, color = 'indigo' }) => {
            const [inputValue, setInputValue] = useState(value);
            useEffect(() => setInputValue(value), [value]);
            
            const handleBlur = () => {
                let num = parseFloat(inputValue);
                if (isNaN(num)) num = value;
                if (num < min) num = min;
                if (num > max) num = max;
                setter(num);
                setInputValue(num);
            };

            const bgColors = {
                indigo: 'bg-slate-50/50 border-slate-200',
                sky: 'bg-sky-50/30 border-sky-100/50',
                amber: 'bg-amber-50/30 border-amber-100/50',
                emerald: 'bg-emerald-50/30 border-emerald-100/50',
                pink: 'bg-pink-50/30 border-pink-100/50',
            };

            return (
                <div className={`p-3 md:p-3 rounded-lg border ${bgColors[color]} flex flex-col h-full relative group`}>
                    <div className="flex justify-between items-center gap-1 mb-3">
                        <label className="text-xs font-bold text-slate-700 flex items-center gap-1 whitespace-nowrap tracking-tight">
                            {label}
                            {info && (
                                <div className="relative flex items-center">
                                    <HelpCircle size={13} className="text-slate-400 cursor-help" />
                                    <div className="absolute bottom-full mb-2 left-1/2 -translate-x-1/2 w-48 p-2 bg-slate-800 text-white text-[10px] rounded shadow-lg opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all z-50 pointer-events-none whitespace-normal">
                                        {info}
                                        <div className="absolute top-full left-1/2 -translate-x-1/2 border-4 border-transparent border-t-slate-800"></div>
                                    </div>
                                </div>
                            )}
                        </label>
                        <div className="flex items-center bg-white rounded border border-slate-300 shadow-sm px-1.5 py-0.5 shrink-0 min-w-0">
                            <input 
                                type="number" step={step} value={inputValue} 
                                onChange={(e) => setInputValue(e.target.value)} 
                                onBlur={handleBlur}
                                onKeyDown={(e) => e.key === 'Enter' && e.target.blur()}
                                className="w-10 sm:w-12 text-xs font-mono text-right bg-transparent outline-none p-0 appearance-none font-bold text-slate-700"
                            />
                            <span className="text-[10px] text-slate-500 pl-1 shrink-0">{suffix}</span>
                        </div>
                    </div>
                    <div className="mt-auto pt-1">
                        <input
                            type="range" min={min} max={max} step={step} value={value}
                            onChange={(e) => setter(Number(e.target.value))}
                            className={`w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-${color}-500`}
                        />
                    </div>
                </div>
            );
        });

        const CustomTooltip = ({ active, payload, label, percentMode }) => {
            if (active && payload && payload.length) {
                const _byKey = {};
                payload.filter(entry => !String(entry.dataKey).includes('_bg_')).forEach(entry => { _byKey[String(entry.dataKey)] = entry; });
                const filteredPayload = Object.values(_byKey);

                return (
                    <div className="bg-white/95 backdrop-blur p-3 border border-slate-200 shadow-xl rounded-xl text-xs z-50 min-w-[160px]">
                        <p className="font-bold text-slate-700 mb-2 border-b border-slate-100 pb-1">
                            <span>退休第 {label} 年</span>
                        </p>
                        <div className="space-y-2">
                            {filteredPayload.map((entry, index) => {
                                let val = entry.value;
                                if (typeof val !== 'number') return null; 
                                
                                const isPercent = percentMode || entry.name === '市場報酬' || String(entry.dataKey).includes('survival') || String(entry.name).includes('率') || String(entry.name).includes('佔比');
                                
                                if (isPercent) val = val.toFixed(1) + '%';
                                else val = Math.round(val).toLocaleString() + ' 萬';
                                
                                return (
                                    <div key={index} className="flex items-center justify-between gap-4">
                                        <div className="flex items-center gap-1.5">
                                            <span className="w-2 h-2 rounded-sm" style={{ backgroundColor: entry.color || entry.fill }}></span>
                                            <span className="font-medium text-slate-600 truncate max-w-[80px]">{entry.name}</span>
                                        </div>
                                        <span className="font-mono font-bold" style={{ color: entry.color || entry.fill }}>{val}</span>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                );
            }
            return null;
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('monteCarlo'); 
            const [auditStrategy, setAuditStrategy] = useState('guyton');
            const [simSeed, setSimSeed] = useState(0); 
            const [showDefinitions, setShowDefinitions] = useState(false);
            
            const [initialCapital, setInitialCapital] = useState(2000); 
            const [initialWithdrawalRate, setInitialWithdrawalRate] = useState(4.0); 
            
            // 預設為 80% 股債比
            const [stockRatio, setStockRatio] = useState(60); // 退休時股票比例(預設 60%)
            
            const [cagr, setCagr] = useState(7.6); 
            const [volatility, setVolatility] = useState(11.2); 
            const [inflation, setInflation] = useState(3.0); 
            const [years, setYears] = useState(30);
            const [simCount, setSimCount] = useState(1000);
            const [sorrTest, setSorrTest] = useState(false);

            const handleStockRatioChange = (newRatio) => {
                setStockRatio(newRatio);
                const params = getAssetAllocationParams(newRatio);
                setCagr(params.r);
                setVolatility(params.v);
            };

            const [vanCeiling, setVanCeiling] = useState(5.0); 
            const [vanFloor, setVanFloor] = useState(2.5); 
            const [gkCapPreserveThresh, setGkCapPreserveThresh] = useState(20); 
            const [gkCapPreserveCut, setGkCapPreserveCut] = useState(10); 
            const [gkProsperityThresh, setGkProsperityThresh] = useState(20); 
            const [gkProsperityHike, setGkProsperityHike] = useState(10); 
            const [yaleWeight, setYaleWeight] = useState(80); // Yale 平滑:錨定去年支出的權重(%)，Tobin/耶魯預設 80
            const [selectedModels, setSelectedModels] = useState(['baseline', 'vanguard', 'guyton', 'endowment']);

            const [viewMode, setViewMode] = useState('withdrawal'); 
            const [auditChartMode, setAuditChartMode] = useState('netWorth'); 
            const [simResults, setSimResults] = useState(null);
            const [isSimulating, setIsSimulating] = useState(false);
            const activeStrategies = strategiesDef.filter(s => selectedModels.includes(s.id));

            useEffect(() => {
                setIsSimulating(true);
                const timer = setTimeout(() => {
                    const runSimulation = () => {
                        const initialWithdrawal = initialCapital * (initialWithdrawalRate / 100);
                        
                        const pathsNW = { baseline: [], vanguard: [], guyton: [] };
                        const pathsW = { baseline: [], vanguard: [], guyton: [] };
                        const survivals = { baseline: new Array(years + 1).fill(0), vanguard: new Array(years + 1).fill(0), guyton: new Array(years + 1).fill(0) };
                        
                        let totals = {
                            baseline: { dead: 0, finalNW: [], totalWithdrawn: [], downgradedYears: 0, wCVData: [] },
                            vanguard: { dead: 0, finalNW: [], totalWithdrawn: [], downgradedYears: 0, wCVData: [] },
                            guyton: { dead: 0, finalNW: [], totalWithdrawn: [], downgradedYears: 0, wCVData: [] }
                        };

                        const auditData = [];
                        const universePerformances = []; 

                        for (let i = 0; i < simCount; i++) {
                            const marketReturns = [];
                            const inflFactors = []; 
                            let currentInflFactor = 1;
                            let pathMarketReturn = 1; 
                            
                            for (let t = 0; t < years; t++) {
                                const Z = randn_bm();
                                let r = (cagr / 100) + (volatility / 100) * Z;
                                
                                if (sorrTest && t < 3) { r = -0.15; }

                                marketReturns.push(r);
                                pathMarketReturn *= (1 + r);
                                
                                currentInflFactor *= (1 + (inflation / 100));
                                inflFactors.push(currentInflFactor);
                                
                                if (i === 0) {
                                    auditData.push({
                                        year: t + 1, marketReturn: r * 100, inflationMult: currentInflFactor,
                                        baseline: {}, vanguard: {}, guyton: {}
                                    });
                                }
                            }
                            
                            universePerformances.push({ idx: i, totalReturn: pathMarketReturn });

                            const simulateStrategy = (stratId, logicFn) => {
                                let nw = initialCapital;
                                let w = 0;
                                let dead = false;
                                const pathNW = [];
                                const pathW = [];
                                const pathRealW = [];
                                let totW = 0;

                                for (let t = 0; t < years; t++) {
                                    let currentNote = '';
                                    const expectedRealW = t === 0 ? initialWithdrawal : initialWithdrawal * inflFactors[t-1];

                                    if (!dead) {
                                        const res = logicFn(t, nw, pathW, marketReturns, inflFactors, expectedRealW);
                                        w = res.w;
                                        currentNote = res.note;
                                    } else {
                                        w = 0;
                                        currentNote = '資產耗盡';
                                    }

                                    if (w < expectedRealW - 0.1) totals[stratId].downgradedYears++;

                                    if (!dead) {
                                        nw -= w;
                                        if (nw <= 0) { nw = 0; dead = true; }
                                        else { nw *= (1 + marketReturns[t]); }
                                    }
                                    
                                    totW += w;
                                    pathNW.push(nw);
                                    pathW.push(w);
                                    pathRealW.push(t === 0 ? w : w / inflFactors[t-1]);
                                    
                                    if (!dead) survivals[stratId][t+1]++;
                                    
                                    if (i === 0) {
                                        auditData[t][stratId].nw = nw;
                                        auditData[t][stratId].w = w;
                                        auditData[t][stratId].note = currentNote;
                                    }
                                }
                                
                                if (nw <= 0) totals[stratId].dead++;
                                totals[stratId].finalNW.push(nw);
                                totals[stratId].totalWithdrawn.push(totW);
                                pathsNW[stratId].push(pathNW);
                                pathsW[stratId].push(pathW);

                                const meanW = pathRealW.reduce((a,b)=>a+b,0) / years;
                                const varW = pathRealW.reduce((a,b)=>a+Math.pow(b-meanW, 2),0) / years;
                                const stdW = Math.sqrt(varW);
                                totals[stratId].wCVData.push(meanW > 0 ? (stdW / meanW) * 100 : 0);
                            };

                            simulateStrategy('baseline', (t, nw, histW, mr, inf, exp) => {
                                if (t === 0) return { w: initialWithdrawal, note: '初始提領' };
                                return { w: initialWithdrawal * inf[t-1], note: '依通膨調整' };
                            });

                            simulateStrategy('vanguard', (t, nw, histW, mr, inf, exp) => {
                                if (t === 0) return { w: initialWithdrawal, note: '初始提領' };
                                const expectedW = nw * (initialWithdrawalRate / 100); 
                                const prevActualW = histW[t-1]; 
                                const maxW = prevActualW * (1 + vanCeiling / 100); 
                                const minW = prevActualW * (1 - vanFloor / 100);   
                                const actualW = Math.min(Math.max(expectedW, minW), maxW);
                                
                                let note = '比例自然變動';
                                if (actualW === maxW && expectedW > maxW + 0.1) note = '🟢觸發上限 (限縮)';
                                else if (actualW === minW && expectedW < minW - 0.1) note = '🔴觸發下限 (保護)';
                                return { w: actualW, note };
                            });

                            simulateStrategy('guyton', (t, nw, histW, mr, inf, exp) => {
                                if (t === 0) return { w: initialWithdrawal, note: '初始提領' };
                                const prevReturn = mr[t-1];
                                let nextW = histW[t-1];
                                let note = '';
                                
                                if (prevReturn >= 0) { nextW *= (1 + inflation / 100); note = '隨通膨增加'; } 
                                else { note = '❄️凍結通膨'; } 

                                const wr = (nextW / nw) * 100;
                                if (prevReturn < 0 && wr > initialWithdrawalRate * (1 + gkCapPreserveThresh/100)) {
                                    nextW *= (1 - gkCapPreserveCut/100); note += ' | 🔴保本刪減';
                                } else if (prevReturn > 0 && wr < initialWithdrawalRate * (1 - gkProsperityThresh/100)) {
                                    nextW *= (1 + gkProsperityHike/100); note = '🟢繁榮加薪';
                                }
                                return { w: nextW, note };
                            });
                        }

                        const chartDataNW = [];
                        const chartDataW = [];
                        const chartDataSurv = [];

                        universePerformances.sort((a, b) => a.totalReturn - b.totalReturn);
                        const medianUniverse = universePerformances[Math.floor(simCount / 2)];
                        const medianUniverseIdx = medianUniverse.idx;

                        // 為了畫背景長條圖，重新提取這 1 個特定宇宙每一年的報酬率
                        // 注意：marketReturns 陣列是 [0 到 years-1]
                        const pathReturnsForChart = [];
                        let nwTemp = initialCapital;
                        let deadTemp = false;
                        for (let t = 0; t < years; t++) {
                             // 我們必須用同樣的 random 序列或是我們在上面直接把每次的 returns 存起來
                             // 為了效能，我們在上面 universePerformances 可以存
                        }
                        // 修正：直接從第一個跑回圈的地方，把所有的 marketReturns 存進 auditData[0...years] 時，
                        // 但那是第 0 個 universe。我們需要 P50 universe 的 marketReturn。
                        // 我們在上頭跑時，並未保留每個 universe 的逐年報酬率陣列以節省記憶體。
                        // 退而求其次：為了讓 P50 有背景長條圖，我們可以用淨值反推，或者再跑一次 RNG (固定 seed 不行，因為隨機數不同)。
                        // 這裡採用一個最準確的解法：直接把 universePerformances 存入 { idx, totalReturn, returns: [] }
                        
                    }; // end runSimulation (由於要在原結構加回 returns，我直接在下面這版完整重建)
                    
                    // 重建 runSimulation 以完美支援背景圖
                    const runSimulationWithReturns = () => {
                        const initialWithdrawal = initialCapital * (initialWithdrawalRate / 100);

                        const pathsNW = { baseline: [], vanguard: [], guyton: [], endowment: [] };
                        const pathsW = { baseline: [], vanguard: [], guyton: [], endowment: [] };
                        const survivals = { baseline: new Array(years + 1).fill(0), vanguard: new Array(years + 1).fill(0), guyton: new Array(years + 1).fill(0), endowment: new Array(years + 1).fill(0) };
                        
                        const mkTotal = () => ({ dead: 0, ruinYears: [], finalNW: [], totalWithdrawn: [], allRealWithdrawn: [], survivorWithdrawn: [], survivorRealWithdrawn: [], survivorFinalNW: [], survivorDowngraded: 0, survivorYears: 0, survivorShortfall: [], wCVData: [] });
                        let totals = { baseline: mkTotal(), vanguard: mkTotal(), guyton: mkTotal(), endowment: mkTotal() };

                        const auditData = [];
                        const universePerformances = []; 

                        for (let i = 0; i < simCount; i++) {
                            const marketReturns = [];
                            const inflFactors = []; 
                            let currentInflFactor = 1;
                            let pathMarketReturn = 1; 
                            
                            for (let t = 0; t < years; t++) {
                                const Z = randn_bm();
                                let r = (cagr / 100) + (volatility / 100) * Z;
                                
                                if (sorrTest && t < 3) { r = -0.15; }

                                marketReturns.push(r);
                                pathMarketReturn *= (1 + r);
                                
                                currentInflFactor *= (1 + (inflation / 100));
                                inflFactors.push(currentInflFactor);
                                
                                if (i === 0) {
                                    auditData.push({
                                        year: t + 1, marketReturn: r * 100, inflationMult: currentInflFactor,
                                        baseline: {}, vanguard: {}, guyton: {}, endowment: {}
                                    });
                                }
                            }
                            
                            universePerformances.push({ idx: i, totalReturn: pathMarketReturn, returns: marketReturns });

                            const simulateStrategy = (stratId, logicFn) => {
                                let nw = initialCapital;
                                let w = 0;
                                let dead = false;
                                const pathNW = [];
                                const pathW = [];
                                const pathRealW = [];
                                let totW = 0;
                                let pathDowngraded = 0; // 該路徑「未達首年購買力」的年數
                                let ruinYear = 0;       // 破產發生的年序(0=未破產)

                                for (let t = 0; t < years; t++) {
                                    let currentNote = '';
                                    const expectedRealW = t === 0 ? initialWithdrawal : initialWithdrawal * inflFactors[t-1];

                                    if (!dead) {
                                        const res = logicFn(t, nw, pathW, marketReturns, inflFactors, expectedRealW);
                                        w = res.w;
                                        currentNote = res.note;
                                    } else {
                                        w = 0;
                                        currentNote = '資產耗盡';
                                    }

                                    if (w < expectedRealW - 0.1) pathDowngraded++;

                                    if (!dead) {
                                        nw -= w;
                                        if (nw <= 0) { nw = 0; if (t < years - 1) { dead = true; ruinYear = t + 1; } }
                                        else { nw *= (1 + marketReturns[t]); }
                                    }
                                    
                                    totW += w;
                                    pathNW.push(nw);
                                    pathW.push(w);
                                    pathRealW.push(t === 0 ? w : w / inflFactors[t-1]);
                                    
                                    if (!dead) survivals[stratId][t+1]++;
                                    
                                    if (i === 0) {
                                        auditData[t][stratId].nw = nw;
                                        auditData[t][stratId].w = w;
                                        auditData[t][stratId].note = currentNote;
                                    }
                                }
                                
                                const survived = !dead;
                                const realTotal = pathRealW.reduce((a,b)=>a+b,0); // 全程實質提領；破產路徑=斷炊前累積(尾段為0)
                                if (!survived) { totals[stratId].dead++; totals[stratId].ruinYears.push(ruinYear); }
                                totals[stratId].finalNW.push(nw);
                                totals[stratId].totalWithdrawn.push(totW);
                                totals[stratId].allRealWithdrawn.push(realTotal); // 全宇宙:含破產路徑(天生被存活率加權)
                                pathsNW[stratId].push(pathNW);
                                pathsW[stratId].push(pathW);

                                // 口徑統一：生活品質、CV、生涯總實質提領 全部「僅計順利走完全程的存活路徑」
                                // 存活路徑不存在歸零年，故不會被早夭尾段的 0 污染
                                if (survived) {
                                    totals[stratId].survivorWithdrawn.push(totW);          // 名目（保留備用）
                                    totals[stratId].survivorRealWithdrawn.push(realTotal); // 實質
                                    totals[stratId].survivorFinalNW.push(nw);              // 期末名目淨值(遺產)
                                    totals[stratId].survivorDowngraded += pathDowngraded;
                                    totals[stratId].survivorYears += years;

                                    // 降級「面積」：實質提領低於「維持首年購買力」基準線下方的累計幅度，標準化為平均每年短少 %
                                    let pathShortfall = 0;
                                    for (let yy = 0; yy < pathRealW.length; yy++) { const d = initialWithdrawal - pathRealW[yy]; if (d > 0) pathShortfall += d; }
                                    totals[stratId].survivorShortfall.push(pathShortfall / (initialWithdrawal * years) * 100);

                                    const meanW = realTotal / years;
                                    const varW = pathRealW.reduce((a,b)=>a+Math.pow(b-meanW, 2),0) / years;
                                    const stdW = Math.sqrt(varW);
                                    totals[stratId].wCVData.push(meanW > 0 ? (stdW / meanW) * 100 : 0);
                                }
                            };

                            simulateStrategy('baseline', (t, nw, histW, mr, inf, exp) => {
                                if (t === 0) return { w: initialWithdrawal, note: '初始提領' };
                                return { w: initialWithdrawal * inf[t-1], note: '依通膨調整' };
                            });

                            simulateStrategy('vanguard', (t, nw, histW, mr, inf, exp) => {
                                if (t === 0) return { w: initialWithdrawal, note: '初始提領' };
                                const expectedW = nw * (initialWithdrawalRate / 100); 
                                const prevActualW = histW[t-1]; 
                                const maxW = prevActualW * (1 + vanCeiling / 100); 
                                const minW = prevActualW * (1 - vanFloor / 100);   
                                const actualW = Math.min(Math.max(expectedW, minW), maxW);
                                
                                let note = '比例自然變動';
                                if (actualW === maxW && expectedW > maxW + 0.1) note = '🟢觸發上限 (限縮)';
                                else if (actualW === minW && expectedW < minW - 0.1) note = '🔴觸發下限 (保護)';
                                return { w: actualW, note };
                            });

                            simulateStrategy('guyton', (t, nw, histW, mr, inf, exp) => {
                                if (t === 0) return { w: initialWithdrawal, note: '初始提領' };
                                const prevReturn = mr[t-1];
                                const prevW = histW[t-1];
                                let nextW, note;

                                // 規則1+2 修正版提領法則(Modified WR, GK 2006 p.5)＋通膨法則(IR)
                                // 僅在「前一年負報酬」且「調升後提領率仍高於初始率」時凍結；否則照通膨調升(不補)
                                const inflatedW = prevW * (1 + inflation / 100);
                                const inflatedWR = (inflatedW / nw) * 100;
                                if (prevReturn < 0 && inflatedWR > initialWithdrawalRate) {
                                    nextW = prevW; note = '❄️凍結通膨(WR)';
                                } else {
                                    nextW = inflatedW; note = '隨通膨調升';
                                }

                                // 護欄以「當前提領率 vs 初始提領率」判定，與前一年報酬正負脫鉤(GK 2006 Table 5)
                                const wr = (nextW / nw) * 100;
                                const yearsRemaining = years - t; // 含當年在內的剩餘年數
                                if (wr > initialWithdrawalRate * (1 + gkCapPreserveThresh/100) && yearsRemaining > 15) {
                                    // 保本法則 CPR：提領率衝破上護欄(初始×1.2)則砍10%；最後15年停用
                                    nextW *= (1 - gkCapPreserveCut/100); note += ' | 🔴保本刪減(CPR)';
                                } else if (wr < initialWithdrawalRate * (1 - gkProsperityThresh/100)) {
                                    // 繁榮法則 PR：提領率跌破下護欄(初始×0.8)則加薪10%(不受最後15年限制)
                                    nextW *= (1 + gkProsperityHike/100); note += ' | 🟢繁榮加薪(PR)';
                                }
                                return { w: nextW, note };
                            });

                            simulateStrategy('endowment', (t, nw, histW, mr, inf, exp) => {
                                if (t === 0) return { w: initialWithdrawal, note: '初始提領' };
                                const anchor = histW[t-1] * (1 + inflation / 100);    // 去年支出×通膨
                                const target = nw * (initialWithdrawalRate / 100);    // 當下資產×目標率
                                const wgt = yaleWeight / 100;
                                return { w: wgt * anchor + (1 - wgt) * target, note: `平滑 ${yaleWeight}/${100 - yaleWeight}` };
                            });
                        }

                        const chartDataNW = [];
                        const chartDataW = [];
                        const chartDataSurv = [];

                        universePerformances.sort((a, b) => a.totalReturn - b.totalReturn);
                        const medianUniverse = universePerformances[Math.floor(simCount / 2)];
                        const medianUniverseIdx = medianUniverse.idx;
                        const medianReturns = medianUniverse.returns; // 取得 P50 宇宙的市場表現

                        survivals.baseline[0] = simCount; survivals.vanguard[0] = simCount; survivals.guyton[0] = simCount; survivals.endowment[0] = simCount;

                        // 存活率：第 0~years 年（含起點 100%）
                        for (let t = 0; t <= years; t++) {
                            chartDataSurv.push({
                                year: t,
                                baseline: (survivals.baseline[t] / simCount) * 100,
                                vanguard: (survivals.vanguard[t] / simCount) * 100,
                                guyton: (survivals.guyton[t] / simCount) * 100,
                                endowment: (survivals.endowment[t] / simCount) * 100
                            });
                        }

                        // 淨值 / 提領：第 1~years 年（兩者同範圍，值皆完整，x 軸切換不跳動）
                        for (let t = 1; t <= years; t++) {
                            const nwAtT = { year: t };
                            const wAtT = { year: t };
                            const mRet = medianReturns[t-1] * 100; // 當年市場報酬（背景長條圖用）
                            nwAtT.marketReturn = mRet;
                            wAtT.marketReturn = mRet;

                            ['baseline', 'vanguard', 'guyton', 'endowment'].forEach(strat => {
                                nwAtT[strat] = pathsNW[strat][medianUniverseIdx][t-1];
                                wAtT[strat] = pathsW[strat][medianUniverseIdx][t-1];
                            });

                            chartDataNW.push(nwAtT);
                            chartDataW.push(wAtT);
                        }

                        const stats = {};
                        ['baseline', 'vanguard', 'guyton', 'endowment'].forEach(strat => {
                            const cvs = totals[strat].wCVData.sort((a,b)=>a-b); // 僅含存活路徑
                            const survRealWs = totals[strat].survivorRealWithdrawn;
                            const survCount = survRealWs.length;
                            const allRealWs = totals[strat].allRealWithdrawn;
                            const ruins = totals[strat].ruinYears;
                            // 期望存活年 = 存活率曲線下的面積 = Σ_t 各年存活比例(t=1..years)
                            const expectedSurvivalYears = survivals[strat].slice(1).reduce((a,b)=>a+b,0) / simCount;
                            const sfn = totals[strat].survivorFinalNW.slice().sort((a,b)=>a-b);
                            const sf = totals[strat].survivorShortfall.slice().sort((a,b)=>a-b);
                            const realDeflator = Math.pow(1 + inflation / 100, years); // 期末名目→今日購買力
                            stats[strat] = {
                                // 全宇宙視角
                                successRate: ((simCount - totals[strat].dead) / simCount) * 100,
                                expectedSurvivalYears: expectedSurvivalYears,
                                // 破產評估：破產路徑平均撐到第幾年(0 = 無人破產)
                                avgRuinYear: ruins.length > 0 ? ruins.reduce((a,b)=>a+b,0) / ruins.length : 0,
                                // 全宇宙期望實質提領：含破產路徑，天生被存活率加權，可拿來公平排序策略
                                avgRealAllUniverse: allRealWs.length > 0 ? allRealWs.reduce((a,b)=>a+b,0) / simCount : 0,
                                // 以下三者皆為「存活者視角」：在順利走完全程的前提下
                                avgRealWithdrawn: survCount > 0 ? survRealWs.reduce((a,b)=>a+b,0) / survCount : 0,
                                qolRate: totals[strat].survivorYears > 0 ? 100 - (totals[strat].survivorDowngraded / totals[strat].survivorYears) * 100 : 0,
                                medianCV: survCount > 0 ? cvs[Math.floor(survCount / 2)] : 0,
                                // 平均短少%：降級面積(低於首年購買力基準線下方)標準化後的中位數
                                medianShortfall: sf.length > 0 ? sf[Math.floor(sf.length / 2)] : 0,
                                // 期末實質淨值(中位，僅存活者)：遺產/安全邊際；過大可能代表生前花太少
                                medianRealFinalNW: sfn.length > 0 ? sfn[Math.floor(sfn.length / 2)] / realDeflator : 0
                            };
                        });

                        return { chartDataNW, chartDataW, chartDataSurv, stats, auditData };
                    };

                    const res = runSimulationWithReturns();
                    setSimResults(res);
                    setIsSimulating(false);
                }, 50);
                return () => clearTimeout(timer);
            }, [initialCapital, initialWithdrawalRate, cagr, volatility, inflation, years, simCount, vanCeiling, vanFloor, gkCapPreserveThresh, gkCapPreserveCut, gkProsperityThresh, gkProsperityHike, yaleWeight, simSeed, sorrTest]);

            const renderChart = () => {

                if (viewMode === 'netWorth') { data = simResults.chartDataNW; yAxisLabel = '淨值 (萬)'; }

                }));

                return (

                }));

                }));

                return (
                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 flex flex-col animate-in fade-in h-auto md:h-[800px]">

                                    <button onClick={() => setAuditChartMode('withdrawal')} className={`flex-1 md:flex-none px-3 py-1.5 rounded-md transition-all ${auditChartMode === 'withdrawal' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500'}`}>比較提領</button>

                                        {selectedModels.includes("vanguard") && <Line yAxisId="left" type="monotone" dataKey="vanguard" name="Vanguard" stroke="#0ea5e9" strokeWidth={2} dot={false} activeDot={{ r: 3 }} isAnimationActive={false} legendType="none" />}

                                                        {activeStrategies.map(s => <Bar key={s.id} dataKey={s.id} fill={s.color} radius={[4, 4, 0, 0]} maxBarSize={40} animationDuration={800} />)}
                                                    </BarChart>
                                                </ResponsiveContainer>
                                            </div>
                                        </div>

                                        <div className="overflow-x-auto custom-scroll bg-white">
                                            <div className="min-w-[560px]">
                                                <table className="w-full text-xs md:text-sm text-center table-fixed">
                                                    <colgroup>
                                                        <col style={{width:'22%'}} />
                                                        <col style={{width:'30%'}} />
                                                        <col style={{width:'24%'}} />
                                                        <col style={{width:'24%'}} />
                                                    </colgroup>
                                                    <thead className="font-extrabold text-slate-500 bg-slate-50 border-b border-slate-200">
                                                        <tr>
                                                            <th rowSpan={2} className="px-2 py-3 border-r border-slate-100 align-middle">策略</th>
                                                            <th className="px-2 py-2 border-r border-slate-200 text-emerald-700 bg-emerald-100/60 text-[10px] md:text-xs font-extrabold tracking-wider">全宇宙</th>
                                                            <th colSpan={2} className="px-2 py-2 text-indigo-700 bg-indigo-100/50 text-[10px] md:text-xs font-extrabold tracking-wider">存活者視角 · 順利走完全程</th>
                                                        </tr>
                                                        <tr>
                                                            <th className="px-2 py-3 border-r border-slate-200 text-emerald-700 bg-emerald-50/50 align-top">
                                                                <div className="flex flex-col items-center gap-0.5">
                                                                    <span>存活率</span>
                                                                    <span className="font-normal text-[10px] md:text-[11px] leading-tight tracking-tight text-emerald-500/90">撐過全程不破產(附:期望存活年)</span>
                                                                </div>
                                                            </th>
                                                            <th className="px-2 py-3 border-r border-slate-100 text-blue-700 bg-blue-50/50 align-top">
                                                                <div className="flex flex-col items-center gap-0.5">
                                                                    <span>預期生活品質佔比</span>
                                                                    <span className="font-normal text-[10px] md:text-[11px] leading-tight tracking-tight text-blue-400/90">維持或超越首年購買力</span>
                                                                </div>
                                                            </th>
                                                            <th className="px-2 py-3 text-amber-700 bg-amber-50/50 align-top">
                                                                <div className="flex flex-col items-center gap-0.5">
                                                                    <span>提領變異係數(CV)</span>
                                                                    <span className="font-normal text-[10px] md:text-[11px] leading-tight tracking-tight text-amber-500/90">越低越穩,生活費不亂跳</span>
                                                                </div>
                                                            </th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-slate-100">
                                                        {activeStrategies.map(s => {
                                                            const stat = simResults?.stats?.[s.id];
                                                            if (!stat) return null;
                                                            return (
                                                                <tr key={s.id} className="hover:bg-slate-50/80 transition-colors">
                                                                    <td className="px-2 py-3 md:py-4 font-bold border-r border-slate-100">
                                                                        <div className="flex items-center justify-center gap-1.5" style={{ color: s.color }}>
                                                                            <span className="shrink-0">{s.icon}</span>
                                                                            <span className="truncate">{s.id === 'guyton' ? 'G-K' : s.name.split(' ')[0]}</span>
                                                                        </div>
                                                                    </td>
                                                                    <td className="px-2 py-3 md:py-4 font-mono font-bold text-emerald-700 bg-emerald-50/20 border-r border-slate-200">
                                                                        <div className="flex flex-col items-center gap-0.5">
                                                                            <span>{stat.successRate.toFixed(1)}%</span>
                                                                            <span className="text-[10px] font-normal tracking-tight text-emerald-500/80">期望存活 {stat.expectedSurvivalYears.toFixed(1)} 年</span>
                                                                        </div>
                                                                    </td>
                                                                    <td className="px-2 py-3 md:py-4 font-mono font-bold text-blue-700 bg-blue-50/20 border-r border-slate-100">
                                                                        <div className="flex flex-col items-center gap-0.5">
                                                                            <span>{stat.qolRate.toFixed(1)}%</span>
                                                                            <span className="text-[10px] font-normal tracking-tight text-blue-400/80">平均短少 -{stat.medianShortfall.toFixed(1)}%</span>
                                                                        </div>
                                                                    </td>
                                                                    <td className="px-2 py-3 md:py-4 font-mono font-bold text-amber-700 bg-amber-50/20">{stat.medianCV.toFixed(1)}%</td>
                                                                </tr>
                                                            );
                                                        })}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            ) : renderAuditTrail()}
                            
                            <div className="mt-8 mb-6 text-center">
                                <a href="https://www.facebook.com/search/top?q=指數三寶飯" target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-1.5 text-[10px] text-slate-300 hover:text-slate-500 transition-colors group">
                                    <span>Designed by</span><span className="font-bold underline decoration-slate-200 underline-offset-2 group-hover:decoration-slate-400">fb/指數三寶飯</span><ExternalLink size={10} className="opacity-60 group-hover:opacity-100" />
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
