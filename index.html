<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>退休動態提領模擬器</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom": "https://esm.sh/react-dom@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "recharts": "https://esm.sh/recharts@2.12.0?external=react,react-dom",
            "lucide-react": "https://esm.sh/lucide-react@0.300.0?external=react"
        }
    }
    </script>

    <style>
        body { font-family: "Inter", "Noto Sans TC", sans-serif; background-color: #f8fafc; }
        input[type="range"] { accent-color: #4f46e5; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .sticky-col { position: sticky; left: 0; background-color: #f8fafc; z-index: 10; box-shadow: 2px 0 5px -2px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo, memo } from 'react';
        import { createRoot } from 'react-dom/client';
        import { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip as RechartsTooltip, ResponsiveContainer, ReferenceLine, Legend, ComposedChart, Bar, BarChart } from 'recharts';
        import { Settings, Activity, ShieldCheck, Info, Scale, BookOpen, TrendingUp, HelpCircle, ChevronDown, ChevronUp, RefreshCw, Maximize2, FileSearch, LineChart as ChartIcon, ExternalLink } from 'lucide-react';

        // --- Math & Simulation Engine ---
        const randn_bm = () => {
            let u = 0, v = 0;
            while (u === 0) u = Math.random();
            while (v === 0) v = Math.random();
            return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
        };

        const strategiesDef = [
            { 
                id: 'baseline', name: '傳統 4% 法則 (固定購買力)', color: '#94a3b8', icon: <BookOpen size={16}/>, 
                desc: '無論市場漲跌，每年提取首年金額並跟隨通膨調升。生活費最穩，但在大跌時極易耗盡本金。',
                calcSteps: [
                    '首年提領 = 初始資產 × 初始提領率',
                    '次年提領 = 前一年提領額 × (1 + 當年通膨率)',
                    '無視當下資產餘額，強行提領直至歸零'
                ]
            },
            { 
                id: 'vanguard', name: 'Vanguard 動態護欄', color: '#0ea5e9', icon: <ShieldCheck size={16}/>, 
                desc: '提領當下資產的固定比例，但設有變動「天花板」與「地板」，避免生活費暴增跌。',
                calcSteps: [
                    '預期提領 = 當下資產餘額 × 初始提領率',
                    '生活費基準 = 前一年提領額 × (1 + 通膨率)',
                    '設定上限 = 基準 × (1 + 上限參數%)',
                    '設定下限 = 基準 × (1 - 下限參數%)',
                    '最終提領 = 將預期提領限制於【下限, 上限】區間'
                ]
            },
            { 
                id: 'guyton', name: 'Guyton-Klinger 法則', color: '#f59e0b', icon: <TrendingUp size={16}/>, 
                desc: '負報酬凍結通膨；提領率飆高時強制限縮生活費(保本)，提領率過低時主動加薪(繁榮)。',
                calcSteps: [
                    '若當年市場負報酬，凍結通膨調整(次年提領=去年)',
                    '當下真實提領率 = 預期提領額 ÷ 當下資產餘額',
                    '[保本]: 負報酬 且 提領率 > 初始提領率×(1+保本閥值)，提領額削減 X%',
                    '[繁榮]: 正報酬 且 提領率 < 初始提領率×(1-繁榮閥值)，提領額增加 Y%'
                ]
            }
        ];

        // --- UI Components ---
        const InputSlider = memo(({ label, value, setter, min, max, step, suffix, info, highlight, color = 'indigo' }) => {
            const [inputValue, setInputValue] = useState(value);
            useEffect(() => setInputValue(value), [value]);
            
            const handleBlur = () => {
                let num = parseFloat(inputValue);
                if (isNaN(num)) num = value;
                if (num < min) num = min;
                if (num > max) num = max;
                setter(num);
                setInputValue(num);
            };

            const bgColors = {
                indigo: highlight ? 'bg-indigo-50/50 border-indigo-100' : 'bg-slate-50/50 border-transparent',
                sky: 'bg-sky-50/30 border-sky-100/50',
                amber: 'bg-amber-50/30 border-amber-100/50',
            };

            return (
                <div className={`mb-3 p-3 rounded-lg border ${bgColors[color]}`}>
                    <div className="flex justify-between items-end mb-1">
                        <label className="text-xs font-bold text-slate-700 flex items-center gap-1.5">
                            {label} 
                            {info && <span title={info} className={`cursor-help text-${color}-400 hover:text-${color}-600`}><HelpCircle size={14}/></span>}
                        </label>
                        <div className="flex items-center bg-white rounded px-1.5 py-0.5 border border-slate-300 shadow-sm">
                            <input 
                                type="number" step={step} value={inputValue} 
                                onChange={(e) => setInputValue(e.target.value)} 
                                onBlur={handleBlur}
                                onKeyDown={(e) => e.key === 'Enter' && e.target.blur()}
                                className="w-16 text-xs font-mono text-right bg-transparent outline-none p-0 appearance-none font-bold text-slate-700"
                            />
                            <span className="text-xs text-slate-500 pl-1">{suffix}</span>
                        </div>
                    </div>
                    <input
                        type="range" min={min} max={max} step={step} value={value}
                        onChange={(e) => setter(Number(e.target.value))}
                        className={`w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer mt-2 accent-${color}-500`}
                    />
                </div>
            );
        });

        const CustomTooltip = ({ active, payload, label }) => {
            if (active && payload && payload.length) {
                const filteredPayload = payload.filter(entry => !String(entry.dataKey).includes('_bg_'));

                return (
                    <div className="bg-white/95 backdrop-blur p-3 border border-slate-200 shadow-xl rounded-xl text-xs z-50 min-w-[180px]">
                        <p className="font-bold text-slate-700 mb-2 border-b border-slate-100 pb-1 flex justify-between">
                            <span>退休第 {label} 年</span>
                        </p>
                        <div className="space-y-2">
                            {filteredPayload.map((entry, index) => {
                                let val = entry.value;
                                if (typeof val !== 'number') return null; 
                                
                                const isPercent = entry.name === '市場報酬' || String(entry.dataKey).includes('survival');
                                
                                if (isPercent) val = val.toFixed(1) + '%';
                                else val = Math.round(val).toLocaleString() + ' 萬';
                                
                                return (
                                    <div key={index} className="flex items-center justify-between gap-6">
                                        <div className="flex items-center gap-2">
                                            <span className="w-2.5 h-2.5 rounded-sm" style={{ backgroundColor: entry.color }}></span>
                                            <span className="font-medium text-slate-600">{entry.name}</span>
                                        </div>
                                        <span className="font-mono font-bold" style={{ color: entry.color }}>{val}</span>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                );
            }
            return null;
        };

        const App = () => {
            // UI State
            const [activeTab, setActiveTab] = useState('monteCarlo'); 
            const [auditStrategy, setAuditStrategy] = useState('guyton');
            const [simSeed, setSimSeed] = useState(0); 
            const [showDefinitions, setShowDefinitions] = useState(false);
            
            // General Settings
            const [initialCapital, setInitialCapital] = useState(2000); 
            const [initialWithdrawalRate, setInitialWithdrawalRate] = useState(4.0); 
            const [cagr, setCagr] = useState(7.0); 
            const [volatility, setVolatility] = useState(15.0); 
            const [inflation, setInflation] = useState(3.0); 
            const [years, setYears] = useState(30);
            const [simCount, setSimCount] = useState(1000);

            // Strategy Settings
            const [vanCeiling, setVanCeiling] = useState(5.0); 
            const [vanFloor, setVanFloor] = useState(2.5); 
            const [gkCapPreserveThresh, setGkCapPreserveThresh] = useState(20); 
            const [gkCapPreserveCut, setGkCapPreserveCut] = useState(10); 
            const [gkProsperityThresh, setGkProsperityThresh] = useState(20); 
            const [gkProsperityHike, setGkProsperityHike] = useState(10); 

            const [viewMode, setViewMode] = useState('netWorth'); 
            const [auditChartMode, setAuditChartMode] = useState('netWorth'); 
            const [simResults, setSimResults] = useState(null);
            const [isSimulating, setIsSimulating] = useState(false);

            useEffect(() => {
                setIsSimulating(true);
                const timer = setTimeout(() => {
                    const runSimulation = () => {
                        const totalSteps = years;
                        const initialWithdrawal = initialCapital * (initialWithdrawalRate / 100);
                        
                        const pathsNW = { baseline: [], vanguard: [], guyton: [] };
                        const pathsW = { baseline: [], vanguard: [], guyton: [] };
                        const survivals = { baseline: new Array(years + 1).fill(0), vanguard: new Array(years + 1).fill(0), guyton: new Array(years + 1).fill(0) };
                        
                        let totals = {
                            baseline: { dead: 0, finalNW: [], totalWithdrawn: [], downgradedYears: 0 },
                            vanguard: { dead: 0, finalNW: [], totalWithdrawn: [], downgradedYears: 0 },
                            guyton: { dead: 0, finalNW: [], totalWithdrawn: [], downgradedYears: 0 }
                        };

                        const auditData = [];

                        for (let i = 0; i < simCount; i++) {
                            const marketReturns = [];
                            const inflFactors = []; 
                            let currentInflFactor = 1;
                            
                            for (let t = 0; t < years; t++) {
                                const Z = randn_bm();
                                const r = (cagr / 100) + (volatility / 100) * Z;
                                marketReturns.push(r);
                                
                                currentInflFactor *= (1 + (inflation / 100));
                                inflFactors.push(currentInflFactor);
                                
                                if (i === 0) {
                                    auditData.push({
                                        year: t + 1,
                                        marketReturn: r * 100,
                                        inflationMult: currentInflFactor,
                                        baseline: {}, vanguard: {}, guyton: {}
                                    });
                                }
                            }

                            // --- 1. Baseline ---
                            let nwBase = initialCapital;
                            let wBase = initialWithdrawal;
                            let deadBase = false;
                            const pathNWBase = [nwBase];
                            const pathWBase = [wBase];
                            let totWBase = wBase;

                            for (let t = 0; t < years; t++) {
                                // 計算當年度期望維持的生活品質 (購買力)
                                const currentExpectedRealW = t === 0 ? initialWithdrawal : initialWithdrawal * inflFactors[t-1];
                                
                                // 檢查是否因為破產或其他原因導致領的錢不如預期 (寬限容錯 0.1 萬)
                                if (wBase < currentExpectedRealW - 0.1) totals.baseline.downgradedYears++;

                                if (!deadBase) {
                                    nwBase -= wBase;
                                    if (nwBase <= 0) { nwBase = 0; deadBase = true; }
                                    else { nwBase *= (1 + marketReturns[t]); }
                                }
                                pathNWBase.push(nwBase);
                                if (!deadBase) survivals.baseline[t+1]++;
                                
                                if (i === 0) {
                                    auditData[t].baseline.nw = nwBase;
                                    auditData[t].baseline.w = wBase;
                                    auditData[t].baseline.note = deadBase ? '資產耗盡' : '依通膨調整';
                                }

                                if (!deadBase && t < years - 1) {
                                    wBase = initialWithdrawal * inflFactors[t];
                                    totWBase += wBase;
                                    pathWBase.push(wBase);
                                } else { pathWBase.push(0); }
                            }
                            if (nwBase <= 0) totals.baseline.dead++;
                            totals.baseline.finalNW.push(nwBase);
                            totals.baseline.totalWithdrawn.push(totWBase);
                            pathsNW.baseline.push(pathNWBase);
                            pathsW.baseline.push(pathWBase);

                            // --- 2. Vanguard Dynamic Approach ---
                            let nwVan = initialCapital;
                            let wVan = initialWithdrawal;
                            let deadVan = false;
                            const pathNWVan = [nwVan];
                            const pathWVan = [wVan];
                            let totWVan = wVan;

                            for (let t = 0; t < years; t++) {
                                let vanNote = '初始提領';
                                const currentExpectedRealW = t === 0 ? initialWithdrawal : initialWithdrawal * inflFactors[t-1];
                                
                                // 生活品質下降偵測
                                if (wVan < currentExpectedRealW - 0.1) totals.vanguard.downgradedYears++;

                                if (!deadVan) {
                                    nwVan -= wVan;
                                    if (nwVan <= 0) { nwVan = 0; deadVan = true; }
                                    else { nwVan *= (1 + marketReturns[t]); }
                                }
                                pathNWVan.push(nwVan);
                                if (!deadVan) survivals.vanguard[t+1]++;

                                if (!deadVan && t < years - 1) {
                                    const expectedW = nwVan * (initialWithdrawalRate / 100); 
                                    const prevWAdjusted = wVan * (1 + inflation / 100); 
                                    const maxW = prevWAdjusted * (1 + vanCeiling / 100); 
                                    const minW = prevWAdjusted * (1 - vanFloor / 100);   
                                    
                                    const actualW = Math.min(Math.max(expectedW, minW), maxW);
                                    
                                    if (t > 0) {
                                        if (actualW === maxW && Math.abs(expectedW - maxW) > 0.1) vanNote = '🟢觸發上限 (限縮提領)';
                                        else if (actualW === minW && Math.abs(expectedW - minW) > 0.1) vanNote = '🔴觸發下限 (保護下檔)';
                                        else vanNote = '比例自然變動';
                                    }

                                    wVan = actualW;
                                    totWVan += wVan;
                                    pathWVan.push(wVan);
                                } else { pathWVan.push(0); }

                                if (i === 0) {
                                    auditData[t].vanguard.nw = nwVan;
                                    auditData[t].vanguard.w = pathWVan[t];
                                    auditData[t].vanguard.note = deadVan ? '資產耗盡' : vanNote;
                                }
                            }
                            if (nwVan <= 0) totals.vanguard.dead++;
                            totals.vanguard.finalNW.push(nwVan);
                            totals.vanguard.totalWithdrawn.push(totWVan);
                            pathsNW.vanguard.push(pathNWVan);
                            pathsW.vanguard.push(pathWVan);

                            // --- 3. Guyton-Klinger Rule ---
                            let nwGk = initialCapital;
                            let wGk = initialWithdrawal;
                            let deadGk = false;
                            const pathNWGk = [nwGk];
                            const pathWGk = [wGk];
                            let totWGk = wGk;

                            for (let t = 0; t < years; t++) {
                                let gkNote = '初始提領';
                                const currentExpectedRealW = t === 0 ? initialWithdrawal : initialWithdrawal * inflFactors[t-1];
                                
                                // 生活品質下降偵測
                                if (wGk < currentExpectedRealW - 0.1) totals.guyton.downgradedYears++;

                                if (!deadGk) {
                                    nwGk -= wGk;
                                    if (nwGk <= 0) { nwGk = 0; deadGk = true; }
                                    else { nwGk *= (1 + marketReturns[t]); }
                                }
                                pathNWGk.push(nwGk);
                                if (!deadGk) survivals.guyton[t+1]++;

                                if (!deadGk && t < years - 1) {
                                    const prevPortReturn = marketReturns[t];
                                    let nextW = wGk;
                                    
                                    if (prevPortReturn >= 0) { nextW = wGk * (1 + inflation / 100); gkNote = '隨通膨增加'; } 
                                    else { nextW = wGk; gkNote = '❄️凍結通膨'; } 

                                    const currentWithdrawalRate = (nextW / nwGk) * 100;
                                    
                                    if (prevPortReturn < 0 && currentWithdrawalRate > initialWithdrawalRate * (1 + gkCapPreserveThresh/100)) {
                                        nextW = nextW * (1 - gkCapPreserveCut/100); 
                                        gkNote += ' | 🔴保本刪減';
                                    } else if (prevPortReturn > 0 && currentWithdrawalRate < initialWithdrawalRate * (1 - gkProsperityThresh/100)) {
                                        nextW = nextW * (1 + gkProsperityHike/100); 
                                        gkNote = '🟢繁榮加薪';
                                    }

                                    wGk = nextW;
                                    totWGk += wGk;
                                    pathWGk.push(wGk);
                                } else { pathWGk.push(0); }

                                if (i === 0) {
                                    auditData[t].guyton.nw = nwGk;
                                    auditData[t].guyton.w = pathWGk[t];
                                    auditData[t].guyton.note = deadGk ? '資產耗盡' : gkNote;
                                }
                            }
                            if (nwGk <= 0) totals.guyton.dead++;
                            totals.guyton.finalNW.push(nwGk);
                            totals.guyton.totalWithdrawn.push(totWGk);
                            pathsNW.guyton.push(pathNWGk);
                            pathsW.guyton.push(pathWGk);
                        }

                        const chartDataNW = [];
                        const chartDataW = [];
                        const chartDataSurv = [];

                        const getMedian = (arr) => {
                            if (!arr || arr.length === 0) return 0;
                            const sorted = [...arr].sort((a,b)=>a-b);
                            return sorted[Math.floor(sorted.length / 2)];
                        };

                        for (let t = 0; t <= years; t++) {
                            survivals.baseline[0] = simCount; survivals.vanguard[0] = simCount; survivals.guyton[0] = simCount;
                            
                            chartDataSurv.push({
                                year: t,
                                baseline: (survivals.baseline[t] / simCount) * 100,
                                vanguard: (survivals.vanguard[t] / simCount) * 100,
                                guyton: (survivals.guyton[t] / simCount) * 100
                            });

                            const nwAtT = { year: t };
                            const wAtT = { year: t };
                            
                            ['baseline', 'vanguard', 'guyton'].forEach(strat => {
                                nwAtT[strat] = getMedian(pathsNW[strat].map(p => p[t]));
                                if (t < years) wAtT[strat] = getMedian(pathsW[strat].map(p => p[t]));
                            });
                            
                            chartDataNW.push(nwAtT);
                            if (t < years) chartDataW.push(wAtT);
                        }

                        const stats = {};
                        ['baseline', 'vanguard', 'guyton'].forEach(strat => {
                            const finalNWs = totals[strat].finalNW.sort((a,b)=>a-b);
                            const totWs = totals[strat].totalWithdrawn.sort((a,b)=>a-b);
                            stats[strat] = {
                                successRate: ((simCount - totals[strat].dead) / simCount) * 100,
                                p10NW: finalNWs[Math.floor(simCount * 0.1)],
                                p50NW: finalNWs[Math.floor(simCount * 0.5)],
                                p90NW: finalNWs[Math.floor(simCount * 0.9)],
                                avgWithdrawn: totWs.reduce((a,b)=>a+b,0) / simCount,
                                // 計算正向指標：預期生活品質佔比 (100% - 生活降級佔比)
                                qolRate: 100 - ((totals[strat].downgradedYears / (simCount * years)) * 100)
                            };
                        });

                        return { chartDataNW, chartDataW, chartDataSurv, stats, auditData };
                    };

                    const res = runSimulation();
                    setSimResults(res);
                    setIsSimulating(false);
                }, 50);
                return () => clearTimeout(timer);
            }, [initialCapital, initialWithdrawalRate, cagr, volatility, inflation, years, simCount, vanCeiling, vanFloor, gkCapPreserveThresh, gkCapPreserveCut, gkProsperityThresh, gkProsperityHike, simSeed]);

            const renderChart = () => {
                if (!simResults) return null;
                
                let data = [];
                let yAxisLabel = '';
                
                if (viewMode === 'netWorth') { data = simResults.chartDataNW; yAxisLabel = '淨值中位數 (萬)'; }
                else if (viewMode === 'withdrawal') { data = simResults.chartDataW; yAxisLabel = '每年提領額中位數 (萬)'; }
                else if (viewMode === 'survival') { data = simResults.chartDataSurv; yAxisLabel = '資金存活機率 (%)'; }

                const legendPayload = strategiesDef.map(s => ({
                    id: s.id,
                    type: 'circle',
                    value: s.name.split(' ')[0],
                    color: s.color
                }));

                return (
                    <div className="h-[400px] w-full mt-4">
                        <ResponsiveContainer width="100%" height="100%">
                            <LineChart data={data} margin={{ top: 20, right: 30, left: 20, bottom: 20 }}>
                                <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                                <XAxis dataKey="year" label={{ value: '退休進入第 N 年', position: 'insideBottom', offset: -10, fontSize: 12, fill: '#64748b' }} stroke="#cbd5e1" tick={{fontSize: 12, fill: '#64748b'}} tickMargin={10} />
                                <YAxis 
                                    stroke="#cbd5e1" 
                                    tickFormatter={(val) => typeof val === 'number' ? (val >= 10000 ? (val/10000).toFixed(0)+'億' : val.toLocaleString()) : val} 
                                    label={{ value: yAxisLabel, angle: -90, position: 'insideLeft', offset: 0, style: { textAnchor: 'middle', fontSize: 12, fill: '#64748b', fontWeight: 'bold' } }} 
                                    domain={viewMode === 'survival' ? [0, 100] : ['auto', 'auto']}
                                    tick={{fontSize: 12, fill: '#64748b'}}
                                />
                                <RechartsTooltip content={<CustomTooltip />} />
                                <Legend payload={legendPayload} verticalAlign="top" height={36} wrapperStyle={{ fontSize: '12px', fontWeight: 'bold', color: '#475569' }}/>
                                
                                {strategiesDef.map(s => (
                                    <Line 
                                        key={`main_${s.id}`} 
                                        type="monotone" 
                                        dataKey={s.id} 
                                        name={s.name.split(' ')[0]} 
                                        stroke={s.color} 
                                        strokeWidth={3} 
                                        dot={false} 
                                        activeDot={{ r: 6, strokeWidth: 0 }} 
                                        legendType="none" 
                                    />
                                ))}
                                
                                {viewMode === 'survival' && <ReferenceLine y={100} stroke="#e2e8f0" strokeDasharray="3 3" />}
                                {viewMode !== 'survival' && <ReferenceLine y={0} stroke="#ef4444" strokeWidth={2} strokeDasharray="5 5" />}
                            </LineChart>
                        </ResponsiveContainer>
                    </div>
                );
            };

            const renderAuditTrail = () => {
                if (!simResults || !simResults.auditData) return null;
                const stratInfo = strategiesDef.find(s => s.id === auditStrategy);

                const auditChartData = simResults.auditData.map(d => ({
                    year: d.year,
                    marketReturn: d.marketReturn,

                                                                return (
                                                                    <div className="flex justify-center gap-4 mb-4">
                                                                        {strategiesDef.map(s => (
                                                                            <div key={s.id} className="flex items-center gap-1.5">
                                                                                <span className="w-3 h-3 rounded-full" style={{backgroundColor: s.color}}></span>
                                                                                <span className="text-[11px] font-bold text-slate-600">{s.name.split(' ')[0]}</span>
                                                                            </div>
                                                                        ))}
                                                                    </div>
                                                                );
                                                            }}
                                                        />
                                                        {strategiesDef.map(s => (
                                                            <Bar key={s.id} dataKey={s.id} name={s.name.split(' ')[0]} fill={s.color} radius={[4, 4, 0, 0]} maxBarSize={45} animationDuration={1000} />
                                                        ))}
                                                    </BarChart>
                                                </ResponsiveContainer>
                                            </div>
                                        </div>

                                        <div className="overflow-x-auto custom-scroll">
                                            <table className="w-full text-sm text-left whitespace-nowrap">
                                                <thead className="text-xs font-extrabold text-slate-500 bg-slate-50 border-b border-slate-200">
                                                    <tr>
                                                        <th className="px-5 py-3">策略</th>
                                                        <th className="px-5 py-3 text-right text-emerald-700 bg-emerald-50/50">存活率</th>
                                                        <th className="px-5 py-3 text-right text-blue-700 bg-blue-50/50">
                                                            <div>預期生活品質佔比</div>
                                                            <div className="text-[9px] font-normal text-blue-600/70 mt-0.5">(維持或超越首年購買力)</div>
                                                        </th>
                                                        <th className="px-5 py-3 text-right">生涯總提領均值</th>
                                                        <th className="px-5 py-3 text-right text-indigo-500">樂觀期末(P90)</th>
                                                        <th className="px-5 py-3 text-right text-indigo-700">中位期末(P50)</th>
                                                        <th className="px-5 py-3 text-right text-rose-600">悲觀期末(P10)</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-100">
                                                    {strategiesDef.map(s => {
                                                        const stat = simResults?.stats?.[s.id];
                                                        if (!stat) return null;
                                                        return (
                                                            <tr key={s.id} className="hover:bg-slate-50/80 transition-colors">
                                                                <td className="px-5 py-4 font-bold flex items-center gap-2" style={{ color: s.color }}>
                                                                    {s.icon} {s.name.split(' ')[0]}
                                                                </td>
                                                                <td className="px-5 py-4 text-right font-mono font-bold text-emerald-700 bg-emerald-50/30">
                                                                    {stat.successRate.toFixed(1)}%
                                                                </td>
                                                                <td className="px-5 py-4 text-right font-mono font-bold text-blue-700 bg-blue-50/30">
                                                                    {stat.qolRate.toFixed(1)}%
                                                                </td>
                                                                <td className="px-5 py-4 text-right font-mono text-slate-600">{Math.round(stat.avgWithdrawn).toLocaleString()} 萬</td>
                                                                <td className="px-5 py-4 text-right font-mono text-indigo-400">{Math.round(stat.p90NW).toLocaleString()} 萬</td>
                                                                <td className="px-5 py-4 text-right font-mono font-bold text-indigo-600">{Math.round(stat.p50NW).toLocaleString()} 萬</td>
                                                                <td className="px-5 py-4 text-right font-mono text-rose-600">{Math.round(stat.p10NW).toLocaleString()} 萬</td>
                                                            </tr>
                                                        );
                                                    })}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            ) : (
                                renderAuditTrail()
                            )}
                            
                            {/* 結尾署名 */}
                            <div className="mt-10 mb-6 text-center">
                                <a 
                                    href="https://www.facebook.com/search/top?q=指數三寶飯" 
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="inline-flex items-center gap-1.5 text-[11px] text-slate-300 hover:text-slate-500 transition-colors select-none group"
                                >
                                    <span>Designed by</span>
                                    <span className="font-bold underline decoration-slate-200 underline-offset-2 group-hover:decoration-slate-400">fb/指數三寶飯</span>
                                    <ExternalLink size={10} className="opacity-60 group-hover:opacity-100" />
                                </a>
                            </div>
                        </div>
                    </div>

                    <div className="fixed bottom-4 right-4 flex flex-col gap-2 z-50">
                        <button 
                             onClick={() => {
                                 const element = document.documentElement;
                                 if (!document.fullscreenElement) {
                                     element.requestFullscreen?.() || element.webkitRequestFullscreen?.();
                                 } else {
                                     document.exitFullscreen?.() || document.webkitExitFullscreen?.();
                                 }
                             }}
                             className="p-3 bg-white rounded-full shadow-lg border border-slate-200 text-slate-500 hover:text-indigo-600 transition-all hover:scale-110"
                             title="切換全螢幕"
                        >
                            <Maximize2 size={20} />
                        </button>
                    </div>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
